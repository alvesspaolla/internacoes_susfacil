name: Publicar Observatório

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    name: Preparar e validar arquivos
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Verificar estrutura original
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s dados/manifest.json || { echo "ERRO: dados/manifest.json ausente na branch main"; exit 1; }
          test -s assets/brasao-mg.png
          test -s assets/sus.png
      - name: Montar site público a partir da raiz
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          cp -R dados _site/dados
          touch _site/.nojekyll
          printf 'origem: raiz\ncommit: %s\n' "$GITHUB_SHA" > _site/versao-publicacao.txt
          python - <<'PYVALID'
          from pathlib import Path
          import json
          root=Path('_site')
          meta=json.loads((root/'dados/manifest.json').read_text(encoding='utf-8'))
          assert meta['modo']=='publico', 'Não publicar agregados restritos'
          assert len(meta['particoes'])==16, 'Esperadas 16 partições de 2025-01 a 2026-04'
          count=0
          for p in meta['particoes']:
              f=root/'dados'/p['arquivo']
              assert f.is_file(),f'Falta {f}'
              rows=json.loads(f.read_text(encoding='utf-8'))
              assert isinstance(rows,list),f'Dados inválidos: {f}'
              count+=len(rows)
          for asset in ['core.png','susfacil.jpeg','brasao-mg.png','sus.png']:
              assert (root/'assets'/asset).is_file(),f'Falta assets/{asset}'
          print(f'PUBLICAÇÃO VALIDADA: 16 meses e {count} células agregadas')
          PYVALID
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato github-pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    name: Publicar site
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
