name: Publicar Observatório
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Montar site público a partir da raiz
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s dados/manifest.json
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R dados _site/dados
          if [ -d assets ]; then cp -R assets _site/assets; fi
          touch _site/.nojekyll
          printf 'origem: index.html (raiz)\ncommit: %s\n' "$GITHUB_SHA" > _site/versao-publicacao.txt
          ls -lah _site
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site público
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
